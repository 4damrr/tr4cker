{{define "tobuy-content"}}
{{with .ToBuy}}
<section class="panel">
  <div class="list-head">
    <h1>To Buy</h1>
    <p class="muted">Marking an item bought records no transaction and moves no balance</p>
  </div>

  <form class="filters">
    <label>
      Status
      <select name="status" onchange="location.href='/to-buy' + (this.value ? '?status=' + this.value : '')">
        <option value=""{{if not .Status}} selected{{end}}>All</option>
        {{range .Statuses}}
          <option value="{{.}}"{{if eq . $.ToBuy.Status}} selected{{end}}>{{statusLabel .}}</option>
        {{end}}
      </select>
    </label>
  </form>

  <form
    class="entry-form"
    hx-post="/to-buy"
    hx-target="#tobuy-list"
    hx-swap="outerHTML"
  >
    <label>
      Name
      <input type="text" name="name" placeholder="Keyboard" required>
    </label>
    <label>
      Category
      <select name="category" required>
        <option value="">Choose a category</option>
        {{range .Categories}}<option value="{{.Key}}">{{.Key}}</option>{{end}}
      </select>
    </label>
    <label>
      Priority
      <select name="priority">
        {{range .Priorities}}<option value="{{.}}">{{priorityLabel .}}</option>{{end}}
      </select>
    </label>
    <label>
      Quantity
      <input type="number" name="qty" min="1" value="1" required>
    </label>
    <label>
      Expected price each
      <input type="text" inputmode="decimal" name="price" value="0" placeholder="0" required>
    </label>
    <label>
      URL
      <input type="url" name="url" placeholder="https://">
    </label>
    <label>
      Notes
      <input type="text" name="notes" placeholder="optional">
    </label>
    <button type="submit">Add item</button>
  </form>

  {{template "tobuy-list" .}}
</section>
{{end}}
{{end}}
